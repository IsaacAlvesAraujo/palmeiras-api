spring.application.name=palmeiras-api

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:palmeirasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Console H2
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.version=openapi_3_1
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

# Paginação
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

server.port=${PORT:8080}
app.admin-key=${ADMIN_API_KEY:}
app.rate-limit=${RATE_LIMIT:60}
app.cors-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
server.forward-headers-strategy=framework
